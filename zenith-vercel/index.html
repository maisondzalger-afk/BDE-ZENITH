<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314361F'/%3E%3Cpath d='M16 4l2.2 9.8L28 16l-9.8 2.2L16 28l-2.2-9.8L4 16l9.8-2.2z' fill='%23C9922E'/%3E%3C/svg%3E">
<title>Zénith · Ressources de l'ESAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F0E6; --surface:#FFFCF7; --ink:#12251A; --muted:#5E6B60; --line:#E6DAC7; --line-2:#D2C3A8;
  --primary:#14361F; --on-primary:#F8F0E6; --sun:#C9922E; --on-sun:#1C1400; --danger:#B3261E;
  --shadow:0 1px 2px rgba(18,37,26,.06),0 6px 20px -8px rgba(18,37,26,.2);
  --f-head:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1B12; --surface:#13291B; --ink:#F2EBDD; --muted:#A3B2A5; --line:#23402D; --line-2:#33553F;
    --primary:#D9AE5C; --on-primary:#12251A; --sun:#D9AE5C; --on-sun:#1C1400; --danger:#FF8A80;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1B12; --surface:#13291B; --ink:#F2EBDD; --muted:#A3B2A5; --line:#23402D; --line-2:#33553F;
  --primary:#D9AE5C; --on-primary:#12251A; --sun:#D9AE5C; --on-sun:#1C1400; --danger:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.logo-sm{height:44px;width:auto;display:block;border-radius:8px;}
.brand b{display:block;font-family:var(--f-head);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14.5px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--on-sun)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn svg{width:17px;height:17px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);padding:0}
.ibtn svg{width:16px;height:16px}
.ibtn.danger{color:var(--danger)}
.ibtn:disabled{opacity:.35;cursor:default}

/* Admin bar */
.adminbar{background:var(--sun);color:var(--on-sun)}
.adminbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-top:10px;padding-bottom:10px}
.adminbar p{margin:0;flex:1 1 220px;font-size:13.5px;line-height:1.35}
.adminbar p b{font-family:var(--f-head);font-size:15px}
.adminbar .btn{background:rgba(255,255,255,.55);border-color:rgba(46,32,0,.25);color:var(--on-sun)}
.adminbar .btn.solid{background:var(--on-sun);color:var(--sun);border-color:var(--on-sun)}

/* Hero */
.hero{position:relative;padding:44px 0 26px;overflow:hidden}
.hero .logo{position:relative;display:block;width:min(440px,92%);height:auto;margin:0 auto 18px;border-radius:14px}
.hero .arcs-old{position:absolute;left:50%;top:0;width:min(760px,150%);transform:translateX(-50%);color:var(--line-2);pointer-events:none}
.hero .arcs .sun{fill:var(--sun)}
.hero h1{position:relative;margin:0;font-family:var(--f-head);font-weight:800;font-size:clamp(32px,8.4vw,54px);line-height:1.02;letter-spacing:-.03em;max-width:15ch}
.hero p{position:relative;margin:14px 0 0;color:var(--muted);max-width:44ch}
.search{position:relative;margin-top:22px}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 16px 0 46px;font-size:16px}
.search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 20%,transparent)}
.search svg{position:absolute;left:15px;top:16px;width:20px;height:20px;color:var(--muted)}

/* Modules */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 12px}
.sect-h h2{margin:0;font-family:var(--f-head);font-size:20px;letter-spacing:-.01em}
.sect-h span{color:var(--muted);font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:1fr;padding-bottom:48px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:820px){.grid{grid-template-columns:1fr 1fr 1fr}}
.mod{position:relative;display:flex;flex-direction:column;min-height:132px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;text-align:left;padding:0;width:100%}
.mod .band{height:8px;background:var(--acc)}
.mod .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.mod .letter{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--acc);color:#fff;font-family:var(--f-head);font-weight:800;font-size:19px}
.mod h3{margin:6px 0 0;font-family:var(--f-head);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.mod .meta{color:var(--muted);font-size:13.5px;margin-top:auto}
.mod .tools{display:flex;gap:6px;padding:0 12px 12px}
.modwrap{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.modwrap .mod{border:0;box-shadow:none;border-radius:0;flex:1}
.modwrap .tools{padding:0 12px 12px}
.add-tile{display:grid;place-items:center;gap:6px;min-height:132px;border:2px dashed var(--line-2);border-radius:16px;background:transparent;color:var(--muted);font-weight:600}
.empty{padding:34px 8px 60px;text-align:center;color:var(--muted)}

/* Module page */
.crumb{display:inline-flex;align-items:center;gap:6px;margin:18px 0 6px;padding:6px 10px 6px 4px;background:none;border:0;color:var(--muted);font-weight:600;font-size:14.5px}
.crumb svg{width:18px;height:18px}
.mhead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:6px}
.mhead h1{margin:0;font-family:var(--f-head);font-weight:800;font-size:clamp(28px,7vw,42px);letter-spacing:-.025em;line-height:1.05;overflow-wrap:anywhere;flex:1 1 260px}
.mhead .row{display:flex;gap:8px;flex-wrap:wrap}
.mmeta{margin:0 0 20px;color:var(--muted)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.case>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-left:6px solid var(--acc)}
.case h2{margin:0;font-family:var(--f-head);font-size:19px;letter-spacing:-.01em;overflow-wrap:anywhere}
.case h2 small{font-family:var(--f-body);font-weight:500;font-size:13.5px;color:var(--muted);margin-left:8px}
.case .tools{display:flex;gap:6px;flex:none}
.items{list-style:none;margin:0;padding:0 8px 8px}
.item{display:flex;align-items:center;gap:8px;border-radius:12px}
.item .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-decoration:none;background:none;border:0;text-align:left}
.item .open:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
.thumb{width:52px;height:52px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:24px;height:24px}
.item .t{min-width:0}
.item .t b{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.item .t span{display:block;font-size:13px;color:var(--muted)}
.item .tools{display:flex;gap:6px;padding-right:4px}
.none{padding:6px 16px 16px;color:var(--muted);font-size:14.5px}
.case footer{padding:0 12px 12px}
.addcase{width:100%;min-height:52px;border:2px dashed var(--line-2);border-radius:16px;background:transparent;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:60px}
.addcase svg{width:18px;height:18px}

/* Modal / toast / lightbox */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,12,35,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:600px){.overlay{align-items:center;padding:20px}}
.sheet{width:100%;max-width:460px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:600px){.sheet{border-radius:20px}}
.sheet h2{margin:0 0 6px;font-family:var(--f-head);font-size:22px;letter-spacing:-.01em}
.sheet .msg{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.sheet label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
.sheet input:not([type=file]),.sheet textarea{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--bg);padding:10px 12px;font-size:16px}
.sheet textarea{min-height:170px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.sheet input[type=file]{width:100%;font-size:14px}
.sheet input:focus,.sheet textarea:focus{outline:none;border-color:var(--primary)}
.sheet .hint{margin:12px 0 0;font-size:13px;color:var(--muted)}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,440px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(6,8,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px}
.lightbox img{max-width:100%;max-height:78%;border-radius:10px;object-fit:contain}
.lightbox p{margin:0;color:#fff;font-weight:600;text-align:center}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.foot{padding:26px 0 40px;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .overlay{animation:fade .18s ease-out}
  .sheet{animation:rise .22s ease-out}
  @keyframes fade{from{opacity:0}}
  @keyframes rise{from{transform:translateY(24px);opacity:.4}}
}
</style>
</head>

function svg(name){
  var s=document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("stroke","currentColor");
  s.setAttribute("stroke-width","2");s.setAttribute("stroke-linecap","round");s.setAttribute("stroke-linejoin","round");
  s.setAttribute("aria-hidden","true");s.innerHTML=ICONS[name]||"";return s;
}
function h(tag,attrs){
  var e=document.createElement(tag);
  for(var k in (attrs||{})){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?"":v);}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(function(x){if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)));});}
  return e;
}

function normalize(d){
  var out={modules:[]};
  ((d&&d.modules)||[]).forEach(function(m){
    out.modules.push({id:String(m.id||uid()),name:String(m.name||"Sans titre"),cases:(m.cases||[]).map(function(cs){
      return {id:String(cs.id||uid()),title:String(cs.title||"Sans titre"),items:(cs.items||[]).map(function(it){
        return {id:String(it.id||uid()),title:String(it.title||"Sans titre"),kind:it.kind||"link",url:it.url||"",asset:it.asset||""};
      })};
    })});
  });
  return out;
}
function api(body,password){
  return fetch("/api/catalogue",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":password},body:JSON.stringify(body)});
}
function persist(){
  var snap=JSON.stringify(data);
  try{localStorage.setItem(LS,snap);}catch(e){}
  if(!online)return;
  queue=queue.then(function(){return api({data:JSON.parse(snap)},pw).then(function(r){
    if(r.status===401){logout();toast("Mot de passe refusé : reconnecte-toi.");return;}
    if(!r.ok)return r.json().then(function(j){toast(j.error||"Enregistrement impossible.");});
  });}).catch(function(){toast("Enregistrement impossible : connexion perdue.");});
}
function commit(){persist();render();}

var toastTimer;
function toast(msg,keep){
  var old=document.querySelector(".toast");if(old)old.remove();
  var t=h("div",{class:"toast",role:"status"},msg);document.body.append(t);
  clearTimeout(toastTimer);if(!keep)toastTimer=setTimeout(function(){t.remove();},4200);
  return t;
}
function openForm(o){
  return new Promise(function(resolve){
    var inputs={};
    var back=h("div",{class:"overlay"});
    var form=h("form",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":o.title});
    form.append(h("h2",{},o.title));
    if(o.message)form.append(h("p",{class:"msg"},o.message));
    (o.fields||[]).forEach(function(f,i){
      var id="f"+i, inp;
      if(f.type==="textarea")inp=h("textarea",{id:id,spellcheck:"false"});
      else inp=h("input",{id:id,type:f.type||"text",accept:f.accept,placeholder:f.placeholder,autocomplete:"off"});
      if(f.required)inp.required=true;
      if(f.value!=null&&f.type!=="file")inp.value=f.value;
      if(f.readonly)inp.readOnly=true;
      inputs[f.name]=inp;
      form.append(h("label",{for:id},f.label),inp);
    });
    if(o.hint)form.append(h("p",{class:"hint"},o.hint));
    function close(v){document.removeEventListener("keydown",esc);back.remove();resolve(v);}
    function esc(e){if(e.key==="Escape")close(null);}
    document.addEventListener("keydown",esc);
    var acts=h("div",{class:"acts"},
      h("button",{class:"btn ghost",type:"button",onclick:function(){close(null);}},o.cancel||"Annuler"),
      o.submit===false?null:h("button",{class:"btn "+(o.danger?"danger":"primary"),type:"submit"},o.submit||"Valider"));
    form.append(acts);
    form.addEventListener("submit",function(e){
      e.preventDefault();var out={};
      (o.fields||[]).forEach(function(f){var i=inputs[f.name];out[f.name]=f.type==="file"?(i.files[0]||null):i.value.trim();});
      close(out);
    });
    back.addEventListener("mousedown",function(e){if(e.target===back)close(null);});
    back.append(form);$("#layer").append(back);
    var first=form.querySelector("input,textarea");if(first&&!first.readOnly)setTimeout(function(){first.focus();},30);
  });
}
function confirmBox(title,message,label){return openForm({title:title,message:message,submit:label||"Supprimer",danger:true}).then(function(v){return !!v;});}
function lightbox(url,title){
  var lb=h("div",{class:"lightbox",role:"dialog","aria-modal":"true","aria-label":title},
    h("button",{class:"ibtn x",type:"button","aria-label":"Fermer",onclick:close},svg("close")),
    h("img",{src:url,alt:title}),h("p",{},title));
  function close(){document.removeEventListener("keydown",esc);lb.remove();}
  function esc(e){if(e.key==="Escape")close();}
  document.addEventListener("keydown",esc);
  lb.addEventListener("click",function(e){if(e.target===lb)close();});
  $("#layer").append(lb);
}
function $(s){return document.querySelector(s);}
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
function findMod(id){return data.modules.filter(function(m){return m.id===id;})[0]||null;}

/* ---------- actions admin ---------- */
async function login(){
  var v=await openForm({title:"Espace administrateur",message:"Réservé aux membres du BDE Zénith.",fields:[{name:"pw",label:"Mot de passe",type:"password",required:true}],submit:"Entrer"});
  if(!v)return;
  if(!online){toast("Le serveur n'est pas joignable pour l'instant. Réessaie dans un moment.");return;}
  try{
    var r=await api({check:true},v.pw);
    if(r.ok){pw=v.pw;admin=true;try{sessionStorage.setItem(SS,"1");sessionStorage.setItem(SP,pw);}catch(e){}render();toast("Mode administrateur activé.");}
    else toast("Mot de passe incorrect.");
  }catch(e){toast("Connexion impossible.");}
}
function logout(){admin=false;pw="";try{sessionStorage.removeItem(SS);sessionStorage.removeItem(SP);}catch(e){}render();}
async function addModule(){
  var v=await openForm({title:"Nouveau module",fields:[{name:"name",label:"Nom du module",required:true,placeholder:"Ex. Comptabilité générale"}],submit:"Créer"});
  if(!v)return;
  data.modules.push({id:uid(),name:v.name,cases:[{id:uid(),title:"Cours",items:[]},{id:uid(),title:"Fiches de révision",items:[]}]});
  commit();
}
async function renameModule(m){
  var v=await openForm({title:"Renommer le module",fields:[{name:"name",label:"Nom du module",value:m.name,required:true}],submit:"Enregistrer"});
  if(!v)return;m.name=v.name;commit();
}
async function deleteModule(m){
  if(!await confirmBox("Supprimer ce module ?","« "+m.name+" » et toutes ses cases et ressources seront supprimés."))return;
  data.modules=data.modules.filter(function(x){return x.id!==m.id;});
  if(view===m.id)view=null;commit();
}
async function addCase(m){
  var v=await openForm({title:"Nouvelle case",message:"Une case regroupe des ressources : cours, TD, annales, fiches…",fields:[{name:"title",label:"Titre de la case",required:true,placeholder:"Ex. Annales 2025"}],submit:"Ajouter"});
  if(!v)return;m.cases.push({id:uid(),title:v.title,items:[]});commit();
}
async function renameCase(cs){
  var v=await openForm({title:"Renommer la case",fields:[{name:"title",label:"Titre",value:cs.title,required:true}],submit:"Enregistrer"});
  if(!v)return;cs.title=v.title;commit();
}
async function deleteCase(m,cs){
  if(!await confirmBox("Supprimer cette case ?","« "+cs.title+" » et ses "+plural(cs.items.length,"ressource","ressources")+" seront supprimées."))return;
  m.cases=m.cases.filter(function(x){return x.id!==cs.id;});commit();
}
function kindFromType(t){t=t||"";if(t.indexOf("image/")===0)return"image";if(t.indexOf("video/")===0)return"video";if(t==="application/pdf")return"pdf";return"file";}
function kindFromUrl(u){return IMG_EXT.test(u)?"image":PDF_EXT.test(u)?"pdf":"link";}
function readAsDataUrl(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}
async function addItem(cs){
  var v=await openForm({title:"Ajouter une ressource",fields:[
    {name:"title",label:"Titre",required:true,placeholder:"Ex. Chapitre 2 – Les amortissements"},
    {name:"file",label:"Fichier (PDF, image, Word, PowerPoint, vidéo…)",type:"file"},
    {name:"url",label:"… ou un lien (Drive, YouTube, site)",type:"url",placeholder:"https://"}
  ],hint:"Les fichiers volumineux peuvent prendre un moment à s'envoyer. Tu peux aussi coller un lien Drive.",submit:"Ajouter"});
  if(!v)return;
  var item={id:uid(),title:v.title,kind:"link",url:"",asset:""};
  if(v.file){
    if(!online){toast("L'envoi de fichiers n'est pas disponible pour l'instant.");return;}
    var t=toast("Envoi du fichier en cours…",true);
    try{
      var mod=await import("https://esm.sh/@vercel/blob@2.8.0/client");
      var name=v.file.name.replace(/[^\w.\-]+/g,"_");
      var b=await mod.upload("ressources/"+name,v.file,{access:"public",handleUploadUrl:"/api/upload",clientPayload:pw});
      item.url=b.url;item.kind=kindFromType(v.file.type);
      if(item.kind==="file"&&PDF_EXT.test(v.file.name))item.kind="pdf";
    }catch(e){t.remove();toast("L'envoi a échoué"+(e&&e.message?" : "+e.message:"."));return;}
    t.remove();
  }else if(v.url){
    if(!safeUrl(v.url)){toast("Le lien doit commencer par https://");return;}
    item.url=v.url;item.kind=kindFromUrl(v.url);
  }else{toast("Ajoute un fichier ou un lien.");return;}
  cs.items.push(item);commit();
}
async function renameItem(it){
  var v=await openForm({title:"Renommer la ressource",fields:[{name:"title",label:"Titre",value:it.title,required:true}],submit:"Enregistrer"});
  if(!v)return;it.title=v.title;commit();
}
async function deleteItem(cs,it){
  if(!await confirmBox("Supprimer cette ressource ?","« "+it.title+" » sera retirée de la case."))return;
  cs.items=cs.items.filter(function(x){return x.id!==it.id;});
  commit();
}
async function exportData(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=h("a",{href:URL.createObjectURL(blob),download:"zenith-catalogue.json"});
  document.body.append(a);a.click();a.remove();toast("Sauvegarde téléchargée.");
}
async function importData(){
  var v=await openForm({title:"Restaurer une sauvegarde",message:"Colle le contenu d'une sauvegarde. Il remplacera tout le contenu actuel.",fields:[{name:"j",label:"Contenu de la sauvegarde",type:"textarea",required:true}],submit:"Restaurer",danger:true});
  if(!v)return;
  try{var d=normalize(JSON.parse(v.j));if(!Array.isArray(JSON.parse(v.j).modules))throw 0;data=d;view=null;commit();toast("Sauvegarde restaurée.");}
  catch(e){toast("Ce texte n'est pas une sauvegarde valide.");}
}

/* ---------- rendu ---------- */
function acc(i){return ACC[i%ACC.length];}
function render(){
  var ab=$("#adminbar");ab.replaceChildren();
  var btn=$("#adminBtn");btn.replaceChildren();
  if(admin){
    btn.append("Quitter l'admin");btn.onclick=logout;
    ab.append(h("div",{class:"adminbar"},h("div",{class:"wrap"},
      h("p",{},h("b",{},"Mode administrateur. "),
        online?"Les modifications sont visibles par tous.":"Hors ligne : les modifications restent sur cet appareil."),
      h("button",{class:"btn sm",type:"button",onclick:exportData},"Sauvegarder"),
      h("button",{class:"btn sm",type:"button",onclick:importData},"Restaurer"))));
  }else{
    btn.append(svg("lock"),"Admin");btn.onclick=login;
  }
  var app=$("#app");app.replaceChildren();
  var m=view?findMod(view):null;
  if(view&&!m)view=null;
  if(m)renderModule(app,m);else renderHome(app);
}
function nav(id){view=id;query="";render();window.scrollTo(0,0);}

function renderHome(app){
  var arcs=h("img",{class:"logo",src:LOGO,alt:"Zénith, au sommet de l'expérience étudiante"});
  var input=h("input",{type:"search",placeholder:"Rechercher un module ou une fiche",value:query,"aria-label":"Rechercher",autocomplete:"off"});
  var gridBox=h("div");
  input.addEventListener("input",function(){query=input.value;fillGrid(gridBox);});
  app.append(h("section",{class:"hero"},arcs,
    h("h1",{},"Tes cours de l'ESAA, au même endroit."),
    h("p",{},"Cours, fiches de révision et annales de chaque module, mis en ligne par le BDE Zénith."),
    h("div",{class:"search"},svg("search"),input)));
  app.append(gridBox);fillGrid(gridBox);
}
function fillGrid(box){
  box.replaceChildren();
  var q=query.trim().toLowerCase();
  var mods=data.modules.map(function(m,i){return{m:m,i:i};}).filter(function(x){
    if(!q)return true;
    if(x.m.name.toLowerCase().indexOf(q)>-1)return true;
    return x.m.cases.some(function(c){return c.title.toLowerCase().indexOf(q)>-1||c.items.some(function(it){return it.title.toLowerCase().indexOf(q)>-1;});});
  });
  box.append(h("div",{class:"sect-h"},h("h2",{},q?"Résultats":"Modules"),h("span",{},plural(mods.length,"module","modules"))));
  var grid=h("div",{class:"grid"});
  mods.forEach(function(x){
    var m=x.m,i=x.i,n=countItems(m);
    var card=h("button",{class:"mod",type:"button",style:"--acc:"+acc(i),onclick:function(){nav(m.id);}},
      h("div",{class:"band"}),
      h("div",{class:"body"},
        h("div",{class:"letter","aria-hidden":"true"},(m.name.trim()[0]||"?").toUpperCase()),
        h("h3",{},m.name),
        h("div",{class:"meta"},plural(m.cases.length,"case","cases")+" · "+plural(n,"ressource","ressources"))));
    if(admin&&!q){
      var idx=data.modules.indexOf(m);
      grid.append(h("div",{class:"modwrap",style:"--acc:"+acc(i)},card,h("div",{class:"tools"},
        ibtn("up","Monter",function(){move(data.modules,idx,-1);commit();},"",idx===0),
        ibtn("down","Descendre",function(){move(data.modules,idx,1);commit();},"",idx===data.modules.length-1),
        ibtn("pencil","Renommer",function(){renameModule(m);}),
        ibtn("trash","Supprimer",function(){deleteModule(m);},"danger"))));
    }else grid.append(card);
  });
  if(admin&&!q)grid.append(h("button",{class:"add-tile",type:"button",onclick:addModule},svg("plus"),"Ajouter un module"));
  if(!mods.length&&!admin)box.append(h("div",{class:"empty"},q?"Aucun résultat pour « "+query+" ».":"Aucun module pour l'instant. Reviens bientôt."));
  else box.append(grid);
  if(!mods.length&&admin&&q)box.append(h("div",{class:"empty"},"Aucun résultat pour « "+query+" »."));
}
function glyph(kind){return kind==="image"?"image":kind==="video"?"video":kind==="link"?"link":"file";}
var KIND_LABEL={image:"Image",pdf:"PDF",video:"Vidéo",file:"Fichier",link:"Lien"};
function renderModule(app,m){
  var mi=data.modules.indexOf(m),color=acc(mi);
  app.append(h("button",{class:"crumb",type:"button",onclick:function(){nav(null);}},svg("back"),"Tous les modules"));
  var head=h("div",{class:"mhead"},h("h1",{},m.name));
  if(admin)head.append(h("div",{class:"row"},
    h("button",{class:"btn sm",type:"button",onclick:function(){renameModule(m);}},svg("pencil"),"Renommer"),
    h("button",{class:"btn sm",type:"button",style:"color:var(--danger)",onclick:function(){deleteModule(m);}},svg("trash"),"Supprimer")));
  app.append(head,h("p",{class:"mmeta"},plural(m.cases.length,"case","cases")+" · "+plural(countItems(m),"ressource","ressources")));
  if(!m.cases.length)app.append(h("div",{class:"empty"},admin?"Ce module n'a pas encore de case.":"Rien ici pour l'instant."));
  m.cases.forEach(function(cs,ci){
    var box=h("section",{class:"case",style:"--acc:"+color});
    var hd=h("header",{},h("h2",{},cs.title,h("small",{},String(cs.items.length))));
    if(admin)hd.append(h("div",{class:"tools"},
      ibtn("up","Monter la case",function(){move(m.cases,ci,-1);commit();},"",ci===0),
      ibtn("down","Descendre la case",function(){move(m.cases,ci,1);commit();},"",ci===m.cases.length-1),
      ibtn("pencil","Renommer la case",function(){renameCase(cs);}),
      ibtn("trash","Supprimer la case",function(){deleteCase(m,cs);},"danger")));
    box.append(hd);
    if(!cs.items.length)box.append(h("p",{class:"none"},admin?"Case vide. Ajoute une première ressource.":"Rien ici pour l'instant."));
    else{
      var ul=h("ul",{class:"items"});
      cs.items.forEach(function(it,ii){
        var url=it.asset?"/_blob/"+encodeURIComponent(it.asset):safeUrl(it.url);
        var thumb=h("span",{class:"thumb"});
        if(it.kind==="image"&&url)thumb.append(h("img",{src:url,alt:"",loading:"lazy"}));else thumb.append(svg(glyph(it.kind)));
        var txt=h("span",{class:"t"},h("b",{},it.title),h("span",{},KIND_LABEL[it.kind]||"Lien"));
        var open=(it.kind==="image"&&url)
          ?h("button",{class:"open",type:"button",onclick:function(){lightbox(url,it.title);}},thumb,txt)
          :h("a",{class:"open",href:url||"#",target:"_blank",rel:"noopener noreferrer"},thumb,txt);
        var li=h("li",{class:"item"},open);
        if(admin)li.append(h("div",{class:"tools"},
          ibtn("up","Monter",function(){move(cs.items,ii,-1);commit();},"",ii===0),
          ibtn("down","Descendre",function(){move(cs.items,ii,1);commit();},"",ii===cs.items.length-1),
          ibtn("pencil","Renommer",function(){renameItem(it);}),
          ibtn("trash","Supprimer",function(){deleteItem(cs,it);},"danger")));
        ul.append(li);
      });
      box.append(ul);
    }
    if(admin)box.append(h("footer",{},h("button",{class:"btn sm",type:"button",onclick:function(){addItem(cs);}},svg("plus"),"Ajouter une ressource")));
    app.append(box);
  });
  if(admin)app.append(h("button",{class:"addcase",type:"button",onclick:function(){addCase(m);}},svg("plus"),"Ajouter une case"));
}

$("#home").addEventListener("click",function(){nav(null);});
render();

/* ---------- chargement du catalogue partagé ---------- */
(async function(){
  try{
    var r=await fetch("/api/catalogue",{cache:"no-store"});
    var j=await r.json();
    online=r.ok&&j&&typeof j==="object";
    if(online){
      if(Array.isArray(j.modules)){data=normalize(j);try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}}
      else data=clone(DEFAULT);
    }
  }catch(e){online=false;}
  if(!online&&admin)admin=false;
  render();
})();
})();
</script>
</body>
</html>
